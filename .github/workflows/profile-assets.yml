name: Build profile assets

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate GitHub activity
        run: node scripts/generate-github-metrics.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%237458e8&color_dots=%23f1effa,%23dcd5ff,%23b5a7ff,%238d78ef,%237458e8
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2355dbe7&color_dots=%23161922,%2325223b,%2342377d,%23735fd7,%239e8cff

      - name: Publish generated assets
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
